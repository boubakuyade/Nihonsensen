<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>日本戦線 ― 師団配置・観戦ウォーゲーム</title>
<style>
:root{--sea:#d6e4e7;--land:#efe8d3;--coast:#8f9d97;--ink:#1c2830;--panel:#f6f2e6;--line:#c8c1aa;--b:#2c60c6;--r:#c0382e;--acc:#d9a021;--mut:#5b6a72;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sea:#0d1a22;--land:#25313a;--coast:#4d5f69;--ink:#e6edf0;--panel:#142530;--line:#2c3f4a;--b:#5b8cf0;--r:#ee6a5e;--acc:#f0b840;--mut:#92a3ab}}
:root[data-theme="dark"]{--sea:#0d1a22;--land:#25313a;--coast:#4d5f69;--ink:#e6edf0;--panel:#142530;--line:#2c3f4a;--b:#5b8cf0;--r:#ee6a5e;--acc:#f0b840;--mut:#92a3ab}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--panel);color:var(--ink);font-family:"Hiragino Sans","Yu Gothic","Noto Sans JP","Meiryo",sans-serif;line-height:1.6}
.wrap{display:flex;flex-wrap:wrap;gap:16px;max-width:1100px;margin:0 auto;padding:12px}
.map{flex:1 1 420px;min-width:0}
.side{flex:1 1 280px;max-width:380px}
svg{width:100%;height:auto;max-height:calc(100vh - 80px);display:block;background:var(--sea);border-radius:6px;user-select:none;-webkit-user-select:none}
svg.setup{touch-action:none;cursor:crosshair}
#cast{display:flex;gap:10px;align-items:center;background:var(--ink);color:var(--panel);border-radius:6px;border-left:6px solid var(--acc);padding:8px 12px;margin-bottom:8px;min-height:24px;font-size:14px;font-weight:600}
#cast .tag{background:var(--acc);color:#1c2830;font-weight:800;border-radius:3px;padding:0 8px;flex:none;font-size:12px}
#ct{flex:1;min-width:0}
h1{margin:0;font-size:24px;font-weight:800;letter-spacing:.08em}
.sub{margin:0 0 12px;color:var(--mut);font-size:13px}
#phase{font-size:16px;font-weight:700;margin:8px 0}
.row{font-size:14px;margin:4px 0}
.row input{font:inherit;font-weight:800;width:7em;border:0;border-bottom:2px dashed currentColor;background:transparent;padding:0 2px;border-radius:0}
.row small{color:var(--mut);font-size:12px;font-weight:400}
.row input.b{color:var(--b)}.row input.r{color:var(--r)}
.row input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.bar{height:8px;border-radius:4px;background:var(--r);overflow:hidden;margin:6px 0 12px}
.bar i{display:block;height:100%;background:var(--b);transition:width .2s}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
button{font:inherit;font-size:14px;padding:9px 14px;border-radius:6px;border:1px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}
button.p{background:var(--ink);color:var(--panel)}
button[aria-pressed="true"].tb{background:var(--b);border-color:var(--b);color:#fff}
button[aria-pressed="true"].tr{background:var(--r);border-color:var(--r);color:#fff}
button[aria-pressed="true"].te{background:var(--ink);color:var(--panel)}
button:disabled{opacity:.4;cursor:default}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
#help{font-size:13px;color:var(--mut);margin:8px 0}
#msg{font-size:18px;font-weight:800;margin:8px 0}
.land{fill:var(--land);stroke:var(--coast);stroke-width:1.5;stroke-linejoin:round}
.city{font-size:10px;fill:var(--ink);fill-opacity:.7;paint-order:stroke;stroke:var(--land);stroke-width:3px}
.u0{--c:var(--b)}.u1{--c:var(--r)}
.xx{font-size:7px;font-weight:700;text-anchor:middle;fill:var(--c);paint-order:stroke;stroke:var(--land);stroke-width:2px}
.cn{font-size:11px;font-weight:700;text-anchor:middle;fill:var(--c);paint-order:stroke;stroke:var(--land);stroke-width:3px}
</style>
</head>
<body>
<div class="wrap">
<div class="map"><div id="cast"><span class="tag">実況</span><span id="ct"></span></div><svg id="svg" viewBox="0 0 640 720" role="img" aria-label="日本地図"><g id="land"></g><g id="T"></g><g id="lab"></g><g id="L"></g></svg></div>
<div class="side">
<h1>日本戦線</h1>
<p class="sub">師団を置いて、領土の奪い合いを観戦しよう。</p>
<div id="phase"></div>
<div class="row"><input id="n0" class="b" value="青軍" maxlength="10" aria-label="青チームの名前"> <span id="bn"></span></div>
<div class="row"><input id="n1" class="r" value="赤軍" maxlength="10" aria-label="赤チームの名前"> <span id="rn"></span></div>
<div class="bar"><i id="bar" style="width:50%"></i></div>
<div id="msg"></div>
<div class="btns" id="btns"></div>
<div id="help"></div>
</div>
</div>
<script>
const $=s=>document.querySelector(s);
const P=(lo,la)=>[(lo-127.5)*32.4+20,(45.8-la)*40+10];
const LAND=[
[[139.9,42.0],[140.4,43.3],[141.3,43.9],[141.7,45.4],[142.2,45.4],[143.4,44.6],[145.3,44.2],[145.6,43.3],[144.5,42.9],[143.3,42.0],[142.0,42.4],[141.0,42.5],[141.2,41.9],[140.6,41.5],[140.2,41.8]],
[[141.3,41.4],[141.5,40.5],[142.0,39.5],[141.6,38.9],[141.5,38.3],[141.0,38.0],[141.0,37.0],[140.6,36.3],[140.85,35.7],[140.3,35.1],[139.85,34.9],[139.85,35.2],[139.95,35.6],[139.7,35.6],[139.65,35.3],[139.6,35.1],[139.1,35.2],[138.85,34.65],[138.3,34.6],[137.3,34.6],[137.0,34.7],[136.9,35.05],[136.9,34.3],[136.2,33.8],[135.8,33.45],[135.2,33.5],[135.15,34.2],[135.4,34.6],[134.7,34.65],[133.9,34.5],[133.2,34.35],[132.5,34.2],[131.9,33.95],[130.9,33.95],[131.0,34.4],[131.8,34.7],[132.5,35.1],[133.2,35.55],[134.3,35.55],[135.2,35.7],[135.8,35.7],[136.1,36.0],[136.7,36.9],[137.2,37.5],[137.0,36.8],[137.8,37.0],[138.5,37.4],[139.1,38.1],[139.6,38.9],[139.8,39.8],[140.0,40.5],[140.3,41.25],[141.0,41.2]],
[[132.4,33.4],[132.7,33.95],[133.5,34.3],[134.3,34.25],[134.6,33.9],[134.2,33.5],[133.5,33.3],[133.0,32.75]],
[[130.0,33.8],[130.9,33.9],[131.7,33.6],[131.9,32.9],[131.5,31.9],[131.3,31.4],[130.7,31.0],[130.2,31.3],[130.3,32.2],[129.9,32.8],[130.2,33.3]],
[[128.0,29.0],[128.5,29.55],[128.8,29.4],[128.3,28.85]]].map(p=>p.map(q=>P(q[0],q[1])));
const CITY=[["札幌",141.35,43.1],["仙台",140.9,38.3],["東京",139.8,35.7],["名古屋",136.9,35.2],["大阪",135.6,34.6],["広島",132.4,34.5],["福岡",130.4,33.6],["那覇",128.4,29.2]];
const CITY2=CITY.concat([["青森",140.7,40.8],["新潟",139.0,37.9],["金沢",136.6,36.6],["静岡",138.4,35.0],["岡山",133.9,34.95],["高松",134.2,34.2],["高知",133.6,33.4],["熊本",130.75,32.8],["鹿児島",130.6,31.6],["函館",140.7,41.7],["松江",132.9,35.4],["長野",138.2,36.65],["宇都宮",139.9,36.6],["京都",135.6,35.4]]).map(c=>{const[x,y]=P(c[1],c[2]);return{n:c[0],x,y}});
const LD=p=>`M${p.map(q=>q.map(v=>v.toFixed(1)).join(',')).join('L')}Z`;
$('#land').innerHTML=`<clipPath id="lc">${LAND.map(p=>`<path d="${LD(p)}"/>`).join('')}</clipPath>`+LAND.map(p=>`<path class="land" d="${LD(p)}"/>`).join('')+'<rect x="12" y="636" width="84" height="66" rx="4" fill="none" stroke="var(--coast)" stroke-dasharray="4 3"/>';
$('#T').setAttribute('clip-path','url(#lc)');
$('#lab').innerHTML=CITY.map(c=>{const[x,y]=P(c[1],c[2]);return `<circle cx="${x}" cy="${y}" r="2" style="fill:var(--ink);fill-opacity:.6"/><text class="city" x="${x+5}" y="${y+14}">${c[0]}</text>`}).join('');

function inPoly(p,x,y){let c=false;for(let i=0,j=p.length-1;i<p.length;j=i++){const[a,b]=p[i],[d,e]=p[j];if((b>y)!=(e>y)&&x<(d-a)*(y-b)/(e-b)+a)c=!c}return c}
const inLand=(x,y)=>LAND.some(p=>inPoly(p,x,y));
function segD(x,y,[ax,ay],[bx,by]){const dx=bx-ax,dy=by-ay;let t=((x-ax)*dx+(y-ay)*dy)/(dx*dx+dy*dy);t=Math.max(0,Math.min(1,t));return Math.hypot(x-ax-t*dx,y-ay-t*dy)}
const nearLand=(x,y,d=7)=>inLand(x,y)||LAND.some(p=>p.some((q,i)=>segD(x,y,q,p[(i+1)%p.length])<d));

/* 六角形の州（領土）グリッド */
const HS=9,CELLS=[],CM=new Map(),DIR=[[1,0],[0,1],[-1,1],[-1,0],[0,-1],[1,-1]];
for(let r=0;r<=56;r++)for(let q=-30;q<=60;q++){const x=HS*Math.sqrt(3)*(q+r/2)+4,y=HS*1.5*r+4;if(x<0||x>640||y<0||y>720)continue;if(nearLand(x,y)){CM.set(q+','+r,CELLS.length);CELLS.push({x,y,q,r})}}
CELLS.forEach(c=>c.nb=DIR.map(([a,b])=>{const k=(c.q+a)+','+(c.r+b);return CM.has(k)?CM.get(k):-1}));
const hv=(c,a)=>[(c.x+HS*Math.cos(a*Math.PI/180)).toFixed(1),(c.y+HS*Math.sin(a*Math.PI/180)).toFixed(1)];
const hexD=c=>'M'+[0,1,2,3,4,5].map(k=>hv(c,60*k+30).join(',')).join('L')+'Z';
const CITYAT={};CITY2.forEach(c=>{let b=-1,bd=196;CELLS.forEach((k,i)=>{const d=(k.x-c.x)**2+(k.y-c.y)**2;if(d<bd){bd=d;b=i}});if(b>=0&&!CITYAT[b])CITYAT[b]=c.n});

const CC=CITY2.map(c=>{let b=0,bd=1e12;CELLS.forEach((k,i)=>{const d=(k.x-c.x)**2+(k.y-c.y)**2;if(d<bd){bd=d;b=i}});return b});
function island(x,y){let b=-1;LAND.forEach((p,i)=>{if(b<0&&inPoly(p,x,y))b=i});if(b>=0)return b;let bd=14;LAND.forEach((p,i)=>{p.forEach((q,j)=>{const d=segD(x,y,q,p[(j+1)%p.length]);if(d<bd){bd=d;b=i}})});return b}
const CI=CELLS.map(c=>island(c.x,c.y)),CITYI=CITY2.map(c=>island(c.x,c.y));
const MAXD=22,STR=CELLS.map((c,i)=>{const L=[];CELLS.forEach((d,j)=>{if(CI[j]!=CI[i]&&(c.x-d.x)**2+(c.y-d.y)**2<3600)L.push(j)});return L});
function cellOf(x,y){
  const x0=q=>q,r0=(y-4)/(1.5*HS),q0=(x-4)/(HS*Math.sqrt(3))-r0/2,z0=r0,y0=-q0-z0;
  let rx=Math.round(q0),ry=Math.round(y0),rz=Math.round(z0);
  const dx=Math.abs(rx-q0),dy=Math.abs(ry-y0),dz=Math.abs(rz-z0);
  if(dx>dy&&dx>dz)rx=-ry-rz;else if(dy>dz)ry=-rx-rz;else rz=-rx-ry;
  const i=CM.get(rx+','+rz);if(i!=null)return i;
  let b=-1,bd=900;CELLS.forEach((c,k)=>{const d=(c.x-x)**2+(c.y-y)**2;if(d<bd){bd=d;b=k}});return b;
}
/* 海の航路グリッド（上陸作戦の経路探索用） */
const GS=10,GW=64,GH=72,SEAF=new Uint8Array(GW*GH),SEAC=[];
for(let gy=0;gy<GH;gy++)for(let gx=0;gx<GW;gx++){const x=gx*GS+5,y=gy*GS+5;if(!nearLand(x,y,9)){SEAF[gy*GW+gx]=1;SEAC.push({i:gy*GW+gx,x,y})}}
function bfs(s){
  const par=new Int16Array(GW*GH).fill(-2);par[s]=-1;const q=[s];
  for(let h=0;h<q.length;h++){const c=q[h],cx=c%GW,cy=(c/GW)|0;
    for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++){
      if(!dx&&!dy)continue;const nx=cx+dx,ny=cy+dy;if(nx<0||ny<0||nx>=GW||ny>=GH)continue;
      const n=ny*GW+nx;if(!SEAF[n]||par[n]!=-2)continue;
      if(dx&&dy&&(!SEAF[cy*GW+nx]||!SEAF[ny*GW+cx]))continue;
      par[n]=c;q.push(n);
    }}
  return par;
}

const RANGE=20,CTOUCH=9,TN=['歩兵','戦車','火砲','空母','戦艦','重巡','軽巡','駆逐'],TM=[[1,1.25,1],[1.15,1,1.45],[1.3,.85,1]],AGGRO=110,GR=90,CAPR=20,CAPT=8,CT=.8,LV=['なし','少','普通','多','大量'],INT=[0,10,7,5,3],NUM=[0,2,4,6,8],MAXU=100,STALE=12,LHP=3,LATK=.8,CAPG=5,CGN=2,TLIM=300,ESC0=1e9,DOM=80,LSIZ=[0,6,12,20,34],SCN=['','小','中','大','特大'],AG=[0,150,180,220,70],CO=[null,{d:20,sp:1.15,at:1.1,b:3},{d:30,sp:1.25,at:1.2,b:6},{d:45,sp:1.35,at:1.3,b:10},{d:80,sp:1.5,at:1.45,b:24}];
const CAPS=[P(135.55,34.85),P(139.75,35.9)].map(([x,y])=>({x,y}));
const NM=['青軍','赤軍'];
const V=t=>`var(--${t?'r':'b'})`;
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dd=()=>[{on:false,pts:[],cool:0,end:0},{on:false,pts:[],cool:0,end:0}];
let S={phase:'setup',mode:0,ut:0,nk:0,nkCd:0,oldc:[[],[]],lv:3,units:[],snap:[],paused:false,speed:1,t:0,win:-1,why:'',fx:[],cp:[0,0],rt:[0,0],sp:[0,0],co:[0,0],coCd:[0,0],hh:[],mor:[100,100],cos:[0,0],ml:[0,0],p:[50,50],dg:[0,0],domT:[0,0],zk:0,Z:1,capT:CAPT,p0:[50,50],xs:[false,false],rf:[1,1],A:[50,50],air:[.5,.5],at:[4,6],sea:[.5,.5],as:[0,0],ss:[0,0],fs:['advance','advance'],fst:[0,0],fcd:[0,0],fm:[0,0],fa:[{x:1,y:0},{x:-1,y:0}],fpts:[[],[]],sup:[null,null],cutN:[0,0],cutSay:[0,0],cm:[0,0],cs:[null,null],cs0:[],ev:[],own:[],prog:[],dirty:true,def:dd(),fl:[],pt:0,ft:0,ct:0,idle:0,dc:0,lastFlip:0,landCd:[0,0],stale:false,lead:-1,mil:[0,0],sg:[false,false],lc:[0,0]};
for(const t of[0,1])$('#n'+t).addEventListener('input',e=>{NM[t]=e.target.value.trim()||(t?'赤軍':'青軍');draw()});
const cnt=t=>S.units.filter(u=>u.team==t).length;
function mk(team,x,y,ty){ty=ty||0;return{team,x,y,hp:[100,130,60,200,260,160,120,80][ty],mh:[100,130,60,200,260,160,120,80][ty],ty,rng:[20,20,48,25,70,52,42,30][ty],cw:[1,1.5,.4,0,0,0,0,0][ty],bh:0,spd:(16+Math.random()*6)*[1,1.5,.7,.85,.75,1,1.15,1.4][ty],dps:(10+Math.random()*4)*[1,1.3,.9,.3,1.8,1.2,1,.8][ty],cdn:3,f:null,sea:!inLand(x,y),seaT:0,ld:0,guard:false,hx:x,hy:y,line:null,cd:0,path:null,pi:0,ob:-1,gk:-2,idle:0,xing:false,idl:0,org:100,sup:1,rtr:0,rp:null,px:x,py:y,rout:0,stk:0,sd:1,tp:null,tc:-1}}
const rty=()=>{const r=Math.random();return r<.55?0:r<.8?1:2};
function addU(team,x,y,landOnly,ty){if(S.units.some(u=>Math.hypot(u.x-x,u.y-y)<6)||(landOnly&&!inLand(x,y))||((ty||0)>=3&&inLand(x,y)))return false;S.units.push(mk(team,x,y,ty));return true}
function setTy(t){S.ut=t;ui()}
function erase(p,r){S.units=S.units.filter(u=>Math.hypot(u.x-p.x,u.y-p.y)>r)}

/* 実況 */
const Q=[];let qT=0;
function say(m,t,low){if(low&&Q.length)return;Q.push({m,t:t==null?-1:t});if(Q.length>4)Q.shift()}
function castTick(){const now=performance.now();if(Q.length&&now-qT>2300){const q=Q.shift();qT=now;$('#ct').textContent=q.m;$('#cast').style.borderLeftColor=q.t<0?'var(--acc)':V(q.t)}}
const nearName=(x,y)=>{let b='',bd=80*80;CITY2.forEach(c=>{const d=(c.x-x)**2+(c.y-y)**2;if(d<bd){bd=d;b=c.n}});return b};
function setCast(m){Q.length=0;qT=performance.now();$('#ct').textContent=m;$('#cast').style.borderLeftColor='var(--acc)'}

/* 初期の勢力圏：一番近い首都・陸の師団の色になる */
function terr(){
  const A=[[CAPS[0].x,CAPS[0].y,0],[CAPS[1].x,CAPS[1].y,1]];
  S.units.forEach(u=>{if(!u.sea)A.push([u.x,u.y,u.team])});
  S.own=CELLS.map(c=>{let b=0,bd=1e12;A.forEach(a=>{const d=(a[0]-c.x)**2+(a[1]-c.y)**2;if(d<bd){bd=d;b=a[2]}});return b});
  S.prog=CELLS.map(()=>0);S.dirty=true;
}
const touch=()=>{terr();draw();ui()};

const svg=$('#svg');
const pt=e=>{const q=svg.createSVGPoint();q.x=e.clientX;q.y=e.clientY;return q.matrixTransform(svg.getScreenCTM().inverse())};
let down=false,lastP=null,prev=0;
function paint(e,first){
  const p=pt(e);
  if(S.mode>=3){if(first&&inLand(p.x,p.y)){CAPS[S.mode-3]={x:p.x,y:p.y};touch()}return}
  if(!first&&lastP&&Math.hypot(p.x-lastP.x,p.y-lastP.y)<13)return;
  lastP=p;if(S.mode==2)erase(p,12);else addU(S.mode,p.x,p.y,false,S.ut);touch();
}
svg.addEventListener('pointerdown',e=>{if(S.phase!='setup'||e.button!=0)return;e.preventDefault();down=true;svg.setPointerCapture(e.pointerId);paint(e,true)});
svg.addEventListener('pointermove',e=>{if(down)paint(e)});
['pointerup','pointercancel'].forEach(n=>svg.addEventListener(n,()=>{down=false}));
svg.addEventListener('contextmenu',e=>{e.preventDefault();if(S.phase=='setup'){erase(pt(e),14);touch()}});

function sample(){
  S.units=[];
  const B=[[132.4,34.5],[131.4,34.2],[131.9,34.6],[133.0,35.3],[133.9,34.95],[134.6,35.2],[135.0,34.9],[135.6,35.4],[135.2,35.5],[130.4,33.6],[133.6,33.4]];
  const R=[[140.9,38.3],[139.9,36.6],[138.2,36.65],[138.4,35.0],[138.0,35.3],[138.0,36.9],[139.0,37.9],[140.1,39.7],[140.7,40.8],[141.35,43.1],[140.7,41.7]];
  [B,R].forEach((A,t)=>A.forEach(a=>{const[x,y]=P(a[0],a[1]);addU(t,x,y,true,rty());for(let r=0;r<(t==0?2:1);r++)for(let k=0;k<8;k++){const n=S.units.length;addU(t,x+(Math.random()-.5)*50,y+(Math.random()-.5)*50,true,rty());if(S.units.length>n)break}}));
  [[135.2,33.0,3],[134.4,33.1,4],[133.6,32.6,5],[135.8,33.0,6],[134.9,32.6,7]].forEach(a=>{const[x,y]=P(a[0],a[1]);addU(0,x,y,false,a[2])});
  [[141.8,35.0,3],[141.9,36.0,4],[141.6,34.3,5],[142.0,37.2,6],[141.8,38.0,7]].forEach(a=>{const[x,y]=P(a[0],a[1]);addU(1,x,y,false,a[2])});
  touch();
}
function clearAll(){S.units=[];touch()}
function setMode(m){S.mode=m;ui()}
function lvl(){S.lv=(S.lv+1)%5;ui()}
function start(){
  if(!cnt(0)||!cnt(1))return;
  S.snap=S.units.map(u=>({...u,f:null,line:null,path:null,rp:null}));S.cs0=[{...CAPS[0]},{...CAPS[1]}];

    else if(sd>=0){tx=U[sd].x;ty=U[sd].y;stop=u.rng*.85;eng=sdd<=u.rng*u.rng}
    else if(u.path){const w=u.path[u.pi];tx=w[0];ty=w[1];stop=2;if(Math.hypot(tx-u.x,ty-u.y)<9){u.pi++;if(u.pi>=u.path.length)u.path=null}}
    else if(hold){tx=home.x;ty=home.y;stop=4}
    else if(u.ty>=3){tx=u.x;ty=u.y;stop=0}
    else{const e=(S.co[u.team]>S.t&&S.cos[u.team]==4)?CAPS[1-u.team]:u.ob>=0?CITY2[u.ob]:u.ob==-1?CAPS[1-u.team]:u.ob==-3?u.tp:null;if(e){tx=e.x;ty=e.y;stop=6}else{tx=u.x;ty=u.y;stop=0}}
    const d=Math.hypot(tx-u.x,ty-u.y);
    if(!eng&&d>stop){
      const s=Math.min(u.spd*h*(u.sea?1.4:1)*spf*coh,d-stop);
      if(u.sea&&u.ty>=3)stepSea(u,tx,ty,s);
      else if(u.sea||u.xing){u.x+=(tx-u.x)/d*s;u.y+=(ty-u.y)/d*s}
      else{stepLand(u,tx,ty,s);if(!hold){if(Math.hypot(u.x-u.px,u.y-u.py)<s*.3)u.stk+=h;else u.stk=0;if(u.stk>3){u.stk=0;pickObj(u)}}}
    }
  });
  U.forEach((u,i)=>{const dmg=dm[i]/(u.line?LHP:1)*(!u.sea&&u.sup<.2?1.6:1);u.hp-=dmg;u.org=Math.max(0,Math.min(100,u.org-dmg*.25+h*(u.sup>=.5?1.5*u.sup:-1.5*(1-u.sup))))});
  for(let i=0;i<U.length;i++)for(let j=i+1;j<U.length;j++){
    const a=U[i],b=U[j];let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);
    if(d<8){if(d<.01){dx=Math.random()-.5;dy=Math.random()-.5;d=Math.hypot(dx,dy)||1}const k=(8-d)/2/d;a.x-=dx*k;a.y-=dy*k;b.x+=dx*k;b.y+=dy*k}
  }
  U.forEach(u=>{
    let on=inLand(u.x,u.y);if(u.sea&&on&&u.ty>=3){u.x=u.px;u.y=u.py;on=false}
    if(u.sea&&on){u.sea=false;u.path=null;if(u.xing){u.xing=false;if(!u.guard)pickObj(u)}if(u.seaT>=1.5){u.bh=45;u.ld=4;S.lc[u.team]++;S.fx.push({x:u.x,y:u.y-10,t:0,d:1.5,team:u.team,txt:'上陸'})}u.seaT=0}
    else if(!u.sea&&!on){if(u.xing){u.sea=true;u.seaT=0}else{u.x=u.px;u.y=u.py}}
    else if(u.sea)u.seaT+=h;
    if(u.hp<=0){if(u.ty>=3)say(`${NM[u.team]}の${TN[u.ty]}が撃沈された！`,1-u.team,true);S.dc++;S.mor[u.team]=Math.max(0,S.mor[u.team]-.7);S.fx.push({x:u.x,y:u.y,t:0,d:1.2,team:u.team,txt:'✕'})}
  });
  S.units=U.filter(u=>u.hp>0);
  S.fx.forEach(f=>f.t+=h);S.fx=S.fx.filter(f=>f.t<f.d);
  /* 領土の占領：陸の師団が立っているマスが塗り替わる */
  const n=[CELLS.map(()=>0),CELLS.map(()=>0)];
  S.units.forEach(u=>{if(u.sea)return;CELLS.forEach((c,i)=>{if((c.x-u.x)**2+(c.y-u.y)**2<169)n[u.team][i]+=u.cw||1})});
  CELLS.forEach((c,i)=>{
    const a=n[0][i],b=n[1][i];if(a&&b)return;
    const t=a?0:b?1:-1;
    if(t>=0&&S.own[i]!=t){S.prog[i]+=h*Math.min(3,n[t][i])*S.Z;if(S.prog[i]>=CT){const lo=S.own[i];S.mor[lo]=Math.max(0,S.mor[lo]-1.2-(CITYAT[i]?6:0));S.mor[t]=Math.min(100,S.mor[t]+.4);S.own[i]=t;S.prog[i]=0;S.dirty=true;S.lastFlip=S.t;if(CITYAT[i])say(`${CITYAT[i]}が${NM[t]}に占領された！`,t)}}
    else S.prog[i]=Math.max(0,S.prog[i]-h*.5);
  });
  for(let t=0;t<2;t++){
    const c=CAPS[t];let en=0,fr=0;
    let tch=false;S.units.forEach(u=>{if(u.sea)return;const d=Math.hypot(u.x-c.x,u.y-c.y);if(u.team==t){if(d<CAPR*1.6)fr++}else{if(d<CAPR)en++;if(d<CTOUCH)tch=true}});
    S.cp[t]=en*2;if(en>0&&fr==0)S.mor[t]=Math.max(0,S.mor[t]-1.5*h);
    if(S.cp[t]>.3&&!S.sg[t]){S.sg[t]=true;say(`${NM[1-t]}が${NM[t]}の首都を包囲！ 陥落寸前！`,1-t)}
    if(S.cp[t]<=0&&S.sg[t]){S.sg[t]=false;S.mor[t]=Math.min(100,S.mor[t]+8);S.mor[1-t]=Math.max(0,S.mor[1-t]-6);say(`【首都攻城戦 防衛成功】${NM[t]}が首都を守り抜き、${NM[1-t]}の包囲は失敗！`,t)}
    if(tch){if(relocate(t))continue;return finish(1-t,`${NM[t]}の首都に触れて占領（遷都に失敗）`)}
  }
  for(let t=0;t<2;t++)S.mor[t]=Math.min(100,S.mor[t]+(.35+(S.co[t]>S.t?.8:0))*h);
  S.ct+=h;
  if(S.ct>=3){
    S.ct=0;
    if(S.dc>=6)say(`各地で激戦！ ここ数秒で${S.dc}個師団が壊滅！`,-1);
    S.dc=0;
    for(let t=0;t<2;t++)if(S.lc[t]>=3){say(`${NM[t]}の上陸部隊が${S.lc[t]}個師団、上陸に成功！`,t);S.lc[t]=0}
    const tc=[0,0];S.own.forEach(o=>tc[o]++);const tot=tc[0]+tc[1],p=[Math.round(tc[0]/tot*100),Math.round(tc[1]/tot*100)];
    for(let t=0;t<2;t++)for(const m of[60,70,80,90])if(p[t]>=m&&S.mil[t]<m){S.mil[t]=m;say(`${NM[t]}が領土の${m}%を掌握！`,t)}
    const ld=p[0]-p[1]>6?0:p[1]-p[0]>6?1:-1;
    if(ld>=0){if(S.lead>=0&&S.lead!=ld)say(`領土で逆転！ ${NM[ld]}が優勢に！`,ld);S.lead=ld}
    S.hh.push({p});if(S.hh.length>24)S.hh.shift();
    for(let t=0;t<2;t++){
      if(p[t]<45&&Math.random()<.07){const ev=['補給が滞り将兵が疲弊','敵の宣伝ビラで厭戦気分が広がり','将校の離反の噂が流れ','相次ぐ後退で将兵の不安が高まり'][Math.floor(Math.random()*4)];S.mor[t]=Math.max(0,S.mor[t]-12);say(`【士気低下】${NM[t]}で${ev}…（士気-12）`,t)}
    }
    S.idle+=3;
    if(S.idle>=9){S.idle=0;say(`戦況：領土 ${NM[0]} ${p[0]}% 対 ${NM[1]} ${p[1]}%、師団 ${cnt(0)} 対 ${cnt(1)}。`,-1,true)}
  }
  const a=cnt(0),b=cnt(1);
  if((!a||!b)&&!S.lv)finish(a?0:b?1:-1,'敵軍を殲滅');
}
function loop(ts){
  if(S.phase!='battle')return;
  const dt=Math.min(.05,(ts-prev)/1000);prev=ts;
  if(!S.paused){let r=dt*S.speed;while(r>0&&S.phase=='battle'){const h=Math.min(.05,r);step(h);r-=h}}
  draw();
  if(S.phase=='battle')requestAnimationFrame(loop);
}

function renderT(){
  const p=['','','',''],bd=[];
  CELLS.forEach((c,i)=>{
    const o=S.own[i],cutc=S.sup[o]&&S.sup[o][i]==0;p[o+(cutc?2:0)]+=hexD(c);
    c.nb.forEach((j,d)=>{if(j>i&&S.own[j]!=o)bd.push(`M${hv(c,60*d-30).join(',')}L${hv(c,60*d+30).join(',')}`)});
  });
  $('#T').innerHTML=[0,1,2,3].map(t=>`<path d="${p[t]}" style="fill:${V(t%2)};stroke:${V(t%2)}" fill-opacity="${t<2?.34:.1}" stroke-opacity="${t<2?.34:.1}" stroke-width=".8"/>`).join('')
    +`<path d="${bd.join('')}" fill="none" style="stroke:var(--ink)" stroke-opacity=".55" stroke-width="1.3" stroke-linecap="round"/>`;
}
function ship(u){
  const F='style="fill:var(--c)" stroke="#fff" stroke-width=".8"',T=x=>`<circle cx="${x}" cy="-3" r="2.3" ${F}/>`;
  switch(u.ty){
    case 3:return `<path d="M-13,-1L13,-1L10,5L-10,5Z" ${F}/><rect x="-12" y="-3.6" width="24" height="2.6" fill="#fff" fill-opacity=".9"/><rect x="3" y="-8" width="4" height="4.4" ${F}/>`;
    case 4:return `<path d="M-12,-1L12,-1L9,5L-9,5Z" ${F}/>${T(-6)}${T(0)}${T(6)}<rect x="-1.5" y="-8" width="3" height="4" ${F}/>`;
    case 5:return `<path d="M-10,-1L10,-1L7,5L-7,5Z" ${F}/>${T(-4)}${T(4)}<rect x="-1" y="-7" width="2.4" height="3.4" ${F}/>`;
    case 6:return `<path d="M-9,-1L9,-1L6,5L-6,5Z" ${F}/>${T(-3)}<rect x="3" y="-6" width="3" height="5" ${F}/>`;
    case 7:return `<path d="M-8,0L8,0L6,4L-6,4Z" ${F}/><path d="M0,0L0,-7" stroke="#fff" stroke-width="1.1"/>`;
    default:return `<path d="M-9,-1L9,-1L6,5L-6,5Z" ${F}/><path d="M0,-1L0,-8L5,-4L0,-4" style="fill:var(--c)" stroke="#fff" stroke-width=".6"/>`;
  }
}
function draw(){
  if(S.dirty){renderT();S.dirty=false}
  let h='';
  const ln=(pts,t)=>{if(pts.length>1){h+=`<polyline points="${pts.map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join(' ')}" fill="none" style="stroke:${V(t)}" stroke-width="3.5" stroke-dasharray="7 4" stroke-linecap="round" opacity=".9"/>`;const m=pts[pts.length>>1];h+=`<text class="cn" style="--c:${V(t)}" x="${m[0].toFixed(1)}" y="${(m[1]-6).toFixed(1)}" font-size="9">防衛線</text>`}};
  S.def.forEach((d,t)=>{if(d.on)ln(d.pts,t)});
  S.fl.forEach(l=>ln(l.pts,l.t));
  [0,1].forEach(t=>{const q=S.fpts[t];if(S.phase!='setup'&&q.length>1)h+=`<polyline points="${q.map(v=>v[0].toFixed(1)+','+v[1].toFixed(1)).join(' ')}" fill="none" style="stroke:${V(t)}" stroke-width="2" stroke-dasharray="2 4" stroke-linecap="round" opacity=".85"/>`});
  CAPS.forEach((c,t)=>{
    h+=`<g class="u${t}"><circle cx="${c.x}" cy="${c.y}" r="${CAPR}" fill="none" style="stroke:${V(t)}" stroke-width="1.3" stroke-dasharray="3 3" opacity=".8"/>`;
    if(S.cp[t]>0)h+=`<circle cx="${c.x}" cy="${c.y}" r="${CAPR}" fill="none" style="stroke:${V(1-t)}" stroke-width="4" stroke-dasharray="${(Math.min(1,S.cp[t]/(S.capT||CAPT))*125.7).toFixed(1)} 200" transform="rotate(-90 ${c.x} ${c.y})"/>`;
    h+=`<text x="${c.x}" y="${c.y+6}" font-size="17" text-anchor="middle" style="fill:var(--acc);stroke:var(--ink)" stroke-width=".6">★</text><text class="cn" x="${c.x}" y="${c.y+CAPR+12}">${esc(NM[t])}の首都</text></g>`;
  });
  S.units.forEach(u=>{if(u.f&&u.f.hp>0)h+=`<line x1="${u.x.toFixed(1)}" y1="${u.y.toFixed(1)}" x2="${u.f.x.toFixed(1)}" y2="${u.f.y.toFixed(1)}" style="stroke:${V(u.team)}" stroke-width="1.3" stroke-opacity=".75" stroke-dasharray="2 2"/>`});
  S.units.forEach(u=>{
    const body=u.sea?ship(u)
      :`<rect x="-10" y="-6.5" width="20" height="13" rx="1.5" style="fill:var(--c)" stroke="#fff" stroke-width=".8"/>`+(u.ty==1?`<ellipse cx="0" cy="0" rx="6" ry="3" fill="none" stroke="#fff" stroke-width="1.3"/>`:u.ty==2?`<circle cx="0" cy="0" r="2.8" fill="#fff"/>`:`<path d="M-10,-6.5L10,6.5M10,-6.5L-10,6.5" stroke="#fff" stroke-width=".9"/>`);
    const sh=(u.line?`<rect x="-12.5" y="-8.5" width="25" height="17" rx="3" fill="none" style="stroke:var(--acc)" stroke-width="1.8"/>`:'')+((!u.sea&&u.sup<.2&&S.phase!='setup')?`<text x="14" y="-3" font-size="10" text-anchor="middle" style="fill:var(--acc);stroke:var(--ink)" stroke-width=".4">⚠</text>`:'');
    h+=`<g class="u${u.team}" transform="translate(${u.x.toFixed(1)},${u.y.toFixed(1)}) scale(.7)">${sh}${body}<rect x="-10" y="8" width="20" height="2.2" fill="#000" fill-opacity=".25"/><rect x="-10" y="8" width="${(20*Math.max(0,u.hp)/(u.mh||100)).toFixed(1)}" height="2.2" style="fill:var(--c)"/></g>`;
  });
  S.fx.forEach(f=>{const k=f.t/f.d,big=f.txt=='✕';if(f.nuke){h+=`<circle cx="${f.x.toFixed(1)}" cy="${f.y.toFixed(1)}" r="${(8+f.R*Math.min(1,k*2.2)).toFixed(1)}" style="fill:var(--acc)" fill-opacity="${(.6*(1-k)).toFixed(2)}"/><circle cx="${f.x.toFixed(1)}" cy="${f.y.toFixed(1)}" r="${(8+f.R*Math.min(1,k*2.2)).toFixed(1)}" fill="none" stroke="#fff" stroke-width="3" opacity="${(1-k).toFixed(2)}"/><text x="${f.x.toFixed(1)}" y="${(f.y+8).toFixed(1)}" font-size="24" text-anchor="middle" opacity="${(1-k).toFixed(2)}">☢</text>`;return}
    if(f.bomb){const q=Math.min(1,k*2);h+=`<text x="${(f.x0+(f.x-f.x0)*q).toFixed(1)}" y="${(f.y0+(f.y-f.y0)*q).toFixed(1)}" font-size="13" text-anchor="middle" style="fill:${V(f.team)};stroke:var(--land)" stroke-width="3" paint-order="stroke">✈</text>`;if(k>.45){const e=(k-.45)/.55;h+=`<circle cx="${f.x.toFixed(1)}" cy="${f.y.toFixed(1)}" r="${(6+24*e).toFixed(1)}" fill="none" style="stroke:var(--acc)" stroke-width="3" opacity="${(1-e).toFixed(2)}"/>`}return}h+=`<text x="${f.x.toFixed(1)}" y="${(f.y+(big?4:-k*10)).toFixed(1)}" font-size="${big?14:12}" font-weight="700" text-anchor="middle" style="fill:${V(f.team)};stroke:var(--land)" stroke-width="${big?0:3}" paint-order="stroke" opacity="${(1-k).toFixed(2)}">${f.txt}</text>`});
  $('#L').innerHTML=h;
  const tc=[0,0];S.own.forEach(o=>tc[o]++);const tot=tc[0]+tc[1]||1;
  const sm=t=>{const a=S.units.filter(u=>u.team==t);return `${a.length} 個師団（海上 ${a.filter(u=>u.sea).length}）／領土 ${Math.round(tc[t]/tot*100)}%／士気 ${Math.round(S.mor[t])}%<br><small>組織力 ${Math.round(a.length?a.reduce((x,u)=>x+u.org,0)/a.length:0)}%／制空 ${Math.round(S.air[t]*100)}%／制海 ${Math.round(S.sea[t]*100)}%／補給断絶 ${a.filter(u=>!u.sea&&u.sup<.2).length}個／前線:${{advance:'前進',hold:'維持',retreat:'後退'}[S.fs[t]]}</small>`+(S.co[t]>S.t?` ⚔反転攻勢(${SCN[S.cos[t]]})`:'')};
  $('#bn').innerHTML=sm(0);$('#rn').innerHTML=sm(1);
  $('#bar').style.width=(tc[0]/tot*100)+'%';
  if(S.phase=='battle')$('#phase').textContent=(S.paused?'一時停止中':'交戦中')+`（${Math.floor(S.t)}秒）`+(S.lv?` 増援は無限（次 ${Math.ceil(Math.min(S.rt[0],S.rt[1]))}秒）`:'');
  castTick();
}
function B(t,f,c,o){o=o||{};return `<button class="${c||''}" ${o.p!=null?`aria-pressed="${o.p}"`:''} ${o.d?'disabled':''} onclick="${f}">${t}</button>`}
function ui(){
  const ph=S.phase;
  svg.classList.toggle('setup',ph=='setup');
  if(ph=='setup')$('#phase').textContent='配置フェーズ';
  if(ph=='over')$('#phase').textContent=`戦闘終了（${Math.floor(S.t)}秒）`;
  $('#msg').textContent=ph=='over'?(S.win<0?'相打ち':`${NM[S.win]}の勝利！ ${S.why}`):'';
  $('#msg').style.color=S.win==0?'var(--b)':'var(--r)';
  $('#btns').innerHTML=ph=='setup'?
    B('青を置く','setMode(0)','tb',{p:S.mode==0})+B('赤を置く','setMode(1)','tr',{p:S.mode==1})
    +B('歩兵','setTy(0)','te',{p:S.ut==0})+B('戦車','setTy(1)','te',{p:S.ut==1})+B('火砲','setTy(2)','te',{p:S.ut==2})
    +B('空母','setTy(3)','te',{p:S.ut==3})+B('戦艦','setTy(4)','te',{p:S.ut==4})+B('重巡','setTy(5)','te',{p:S.ut==5})+B('軽巡','setTy(6)','te',{p:S.ut==6})+B('駆逐','setTy(7)','te',{p:S.ut==7})
    +B('青の首都','setMode(3)','tb',{p:S.mode==3})+B('赤の首都','setMode(4)','tr',{p:S.mode==4})+B('消しゴム','setMode(2)','te',{p:S.mode==2})
    +B('増援：'+LV[S.lv],'lvl()')+B('サンプル配置','sample()')+B('全消去','clearAll()')
    +B('戦闘開始','start()','p',{d:!(cnt(0)&&cnt(1))}):
    ph=='battle'?B(S.paused?'再開':'一時停止','pause()','p')+B('速度 ×'+S.speed,'speed()')+B('配置に戻る','back()'):
    B('もう一度戦う','again()','p')+B('配置に戻る','back()');
  $('#help').textContent=ph=='setup'?'地図をタップかなぞると師団を置けます（陸なら四角、海なら船）。兵科は歩兵（×）・戦車（楕円・速くて強い）・火砲（●・射程が長い）から選べます。海に置くと艦艇（空母・戦艦・重巡・軽巡・駆逐）になり、艦隊は敵首都の近海へ向かい制海権を争います。艦艇は海にしか置けません。「首都」ボタンのあと陸地をタップで首都を移動。軍の名前は上の入力欄で変えられます。':
    ph=='battle'?'師団は横並びで前線を作り、崩れそうなら撤退して新しい前線へ。補給が切れた師団（⚠）は包囲されると大きく不利になります。首都が落ちても遷都できることがあります（50%→25%→12%…）。空爆・制空権・制海権も戦況を左右します。':'';
}
setCast('配置フェーズ。師団を置いたら「戦闘開始」！');
terr();draw();ui();
</script>
